server:
  port: 8088

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://${IDENTITY_SERVICE_HOST:localhost}:8085
          predicates:
            - Path=/api/auth/**, /api/test/**
        - id: product-service
          uri: http://${PRODUCT_SERVICE_HOST:localhost}:8086
          predicates:
            - Path=/api/products/**

app:
