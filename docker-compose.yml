version: '3.8'

services:
  identity-db:
    image: postgres:16-alpine
    container_name: identity-postgres
    restart: always
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - identity_pgdata:/var/lib/postgresql/data

volumes:
  identity_pgdata:
